name: CI

on:
  push:
    branches:
      - main
      - '*.x'

  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  phpstan:
    uses: ./.github/workflows/phpstan.yml

  pint:
    uses: ./.github/workflows/pint.yml
